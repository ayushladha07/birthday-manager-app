<div id="root"></div>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #111111;
    --muted: #8a8a8a;
    --muted-2: #b5b5b5;
    --line: #e8e8e8;
    --line-strong: #d4d4d4;
    --black: #0a0a0a;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
  }
  #root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--ink);
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 64px;
    font-size: 15px;
  }
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 32px;
  }
  .masthead h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.3px;
    color: var(--ink);
  }
  .masthead .sub {
    font-size: 13px;
    color: var(--muted);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 26px 28px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 16px;
  }
  label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type=text], input[type=password], input[type=date] {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input::placeholder { color: var(--muted-2); }
  input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 1px var(--ink);
  }
  .row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1.4fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 18px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { opacity: 0.82; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-primary {
    background: var(--black);
    color: #fff;
  }
  .btn-candle {
    background: var(--black);
    color: #fff;
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink); opacity: 1; }
  .btn-danger { background: transparent; color: var(--danger); }
  .helptext {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.6;
  }
  .status {
    font-size: 12.5px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
  }
  .status.ok { background: #f7f7f7; color: var(--ink); }
  .status.err { background: #fdf2f1; color: var(--danger); border-color: #f3d4d1; }
  .friend-list { list-style: none; margin: 0; padding: 0; }
  .friend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--line);
  }
  .friend:last-child { border-bottom: none; }
  .friend .days {
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
    text-align: center;
    padding: 3px 9px;
    border-radius: 20px;
    background: #f2f2f2;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .friend .days.today {
    background: var(--black);
    color: #fff;
    border-color: var(--black);
  }
  .friend .name {
    flex-grow: 1;
    font-size: 15.5px;
    font-weight: 600;
    min-width: 80px;
    color: var(--ink);
  }
  .friend .date {
    font-size: 12px;
    color: var(--muted);
    width: 100%;
    order: 5;
    padding-left: 38px;
  }
  .friend .del {
    font-family: inherit;
    background: none;
    border: none;
    color: var(--muted-2);
    cursor: pointer;
    font-size: 11px;
    margin-left: 2px;
    opacity: 0.7;
    transition: opacity 0.15s, color 0.15s;
  }
  .friend .del:hover { color: var(--ink); opacity: 1; }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 22px 4px;
    text-align: center;
  }
  .footer-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .columns {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 26px;
  }
  @media (max-width: 980px) {
    .columns { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .columns { grid-template-columns: 1fr; }
  }
  .column-header {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--ink);
  }
  select {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
</style>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// Accepts either "MM-DD" or "YYYY-MM-DD"
function parseParts(value) {
  const parts = value.split('-').map(Number);
  if (parts.length === 2) return { mm: parts[0], dd: parts[1], year: null };
  return { mm: parts[1], dd: parts[2], year: parts[0] };
}

function daysUntil(value) {
  const { mm, dd } = parseParts(value);
  const now = new Date();
  const todayLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let target = new Date(now.getFullYear(), mm - 1, dd);
  if (target < todayLocal) target = new Date(now.getFullYear() + 1, mm - 1, dd);
  return Math.round((target - todayLocal) / 86400000);
}

// Age they'll be turning on their next occurrence of this birthday, or null if birth year unknown
function turningAge(value) {
  const { mm, dd, year } = parseParts(value);
  if (!year) return null;
  const now = new Date();
  const todayLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let targetYear = now.getFullYear();
  const target = new Date(targetYear, mm - 1, dd);
  if (target < todayLocal) targetYear += 1;
  return targetYear - year;
}

function formatDate(value) {
  const { mm, dd, year } = parseParts(value);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return year ? `${months[mm-1]} ${dd}, ${year}` : `${months[mm-1]} ${dd}`;
}

function App() {
  const CATEGORIES = [
    { key: 'family', label: 'Family' },
    { key: 'friends', label: 'Friends' },
    { key: 'college', label: 'College Friends' },
    { key: 'other', label: 'Family Friends' },
  ];

  const [owner, setOwner] = useState(() => localStorage.getItem('bday_owner') || '');
  const [repo, setRepo] = useState(() => localStorage.getItem('bday_repo') || '');
  const [token, setToken] = useState(() => localStorage.getItem('bday_token') || '');
  const [rememberMe, setRememberMe] = useState(() => !!localStorage.getItem('bday_token'));
  const [connected, setConnected] = useState(false);
  const [sha, setSha] = useState(null);
  const [friends, setFriends] = useState([]); // [{name, date, category}]
  const [status, setStatus] = useState(null); // {type, text}
  const [loading, setLoading] = useState(false);
  const [newName, setNewName] = useState('');
  const [newDate, setNewDate] = useState('');
  const [newCategory, setNewCategory] = useState('friends');
  const [editingName, setEditingName] = useState(null); // name of friend currently being edited
  const [editName, setEditName] = useState('');
  const [editDate, setEditDate] = useState('');
  const [editCategory, setEditCategory] = useState('friends');
  const [draggingName, setDraggingName] = useState(null);
  const [dragOverCat, setDragOverCat] = useState(null);

  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/birthdays.json`;

  const loadFromGitHub = useCallback(async () => {
    setLoading(true);
    setStatus(null);
    try {
      const res = await fetch(apiUrl, {
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
        },
      });
      if (res.status === 404) {
        setStatus({ type: 'err', text: "Couldn't find birthdays.json in that repo. Check the username and repo name." });
        setLoading(false);
        return;
      }
      if (res.status === 401 || res.status === 403) {
        setStatus({ type: 'err', text: 'GitHub rejected that token. Double check it has repo access and hasn\'t expired.' });
        setLoading(false);
        return;
      }
      if (!res.ok) {
        setStatus({ type: 'err', text: `GitHub returned an error (${res.status}). Try again in a moment.` });
        setLoading(false);
        return;
      }
      const data = await res.json();
      const decoded = decodeURIComponent(escape(atob(data.content)));
      const parsed = JSON.parse(decoded);
      // Each value is either a plain "MM-DD"/"YYYY-MM-DD" string (older
      // format, defaults to "friends") or {date, category} (newer format).
      const list = Object.entries(parsed).map(([name, val]) => {
        if (typeof val === 'string') return { name, date: val, category: 'friends' };
        return { name, date: val.date, category: val.category || 'friends' };
      });
      setFriends(list);
      setSha(data.sha);
      setConnected(true);
      setStatus({ type: 'ok', text: 'Connected — this is live from your repo.' });
      if (rememberMe) {
        localStorage.setItem('bday_owner', owner);
        localStorage.setItem('bday_repo', repo);
        localStorage.setItem('bday_token', token);
      } else {
        localStorage.removeItem('bday_owner');
        localStorage.removeItem('bday_repo');
        localStorage.removeItem('bday_token');
      }
    } catch (e) {
      setStatus({ type: 'err', text: 'Something went wrong reading the file: ' + e.message });
    }
    setLoading(false);
  }, [apiUrl, token, owner, repo, rememberMe]);

  useEffect(() => {
    // If we loaded saved credentials from localStorage, connect automatically.
    if (owner && repo && token && rememberMe) {
      loadFromGitHub();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saveToGitHub = useCallback(async (updatedFriends) => {
    setLoading(true);
    try {
      const obj = {};
      updatedFriends.forEach(f => { obj[f.name] = { date: f.date, category: f.category || 'friends' }; });
      const jsonStr = JSON.stringify(obj, null, 2) + '\n';
      const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
        },
        body: JSON.stringify({
          message: 'Update birthdays.json via Birthday Manager',
          content: b64,
          sha: sha,
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus({ type: 'err', text: 'Save failed: ' + (err.message || res.status) });
        setLoading(false);
        return false;
      }
      const data = await res.json();
      setSha(data.content.sha);
      setStatus({ type: 'ok', text: 'Saved — synced to GitHub, your reminders will use this.' });
      setLoading(false);
      return true;
    } catch (e) {
      setStatus({ type: 'err', text: 'Save failed: ' + e.message });
      setLoading(false);
      return false;
    }
  }, [apiUrl, token, sha]);

  const handleAdd = async () => {
    if (!newName.trim() || !newDate) return;
    // newDate comes from the date input as YYYY-MM-DD — keep the full
    // date (including year) so we can announce the age they're turning.
    const updated = [...friends.filter(f => f.name !== newName.trim()), { name: newName.trim(), date: newDate, category: newCategory }];
    setFriends(updated);
    setNewName('');
    setNewDate('');
    await saveToGitHub(updated);
  };

  const handleDelete = async (name) => {
    const updated = friends.filter(f => f.name !== name);
    setFriends(updated);
    await saveToGitHub(updated);
  };

  const moveToCategory = async (name, newCat) => {
    const target = friends.find(f => f.name === name);
    if (!target || (target.category || 'friends') === newCat) return;
    const updated = friends.map(f => f.name === name ? { ...f, category: newCat } : f);
    setFriends(updated);
    await saveToGitHub(updated);
  };

  const startEdit = (f) => {
    setEditingName(f.name);
    setEditName(f.name);
    setEditCategory(f.category || 'friends');
    // Date input needs YYYY-MM-DD. If this entry has no year on file,
    // default to this year so the field isn't empty — it stays untouched
    // in storage unless the person actually edits the date.
    const { mm, dd, year } = parseParts(f.date);
    const y = year || new Date().getFullYear();
    setEditDate(`${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`);
  };

  const cancelEdit = () => {
    setEditingName(null);
    setEditName('');
    setEditDate('');
  };

  const saveEdit = async (originalName) => {
    if (!editName.trim() || !editDate) return;
    const updated = friends
      .filter(f => f.name !== originalName)
      .concat([{ name: editName.trim(), date: editDate, category: editCategory }]);
    setFriends(updated);
    cancelEdit();
    await saveToGitHub(updated);
  };

  if (!connected) {
    return (
      <div>
        <div className="masthead">
          <h1>Birthday Manager</h1>
          <span className="sub">connects to your GitHub repo</span>
        </div>
        <div className="panel">
          <h2>Connect to your repo</h2>
          <div className="row3">
            <div>
              <label>GitHub username</label>
              <input type="text" value={owner} onChange={e => setOwner(e.target.value)} placeholder="ayushladha07" />
            </div>
            <div>
              <label>Repo name</label>
              <input type="text" value={repo} onChange={e => setRepo(e.target.value)} placeholder="birthday" />
            </div>
            <div>
              <label>Personal access token</label>
              <input type="password" value={token} onChange={e => setToken(e.target.value)} placeholder="github_pat_..." />
            </div>
          </div>
          <label style={{display: 'flex', alignItems: 'center', gap: 6, marginBottom: 14, cursor: 'pointer'}}>
            <input type="checkbox" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} style={{width: 'auto', margin: 0}} />
            <span style={{fontSize: 12.5, color: 'var(--muted)'}}>Remember these on this device (so I don't have to re-enter next time)</span>
          </label>
          <button className="btn btn-primary" disabled={!owner || !repo || !token || loading} onClick={loadFromGitHub}>
            {loading ? 'Connecting…' : 'Connect'}
          </button>
          {status && <div className={`status ${status.type}`} style={{marginTop: 14}}>{status.text}</div>}
          <div className="helptext">
            Create a token at github.com/settings/tokens → "Fine-grained tokens" → New token.
            Scope it to only this one repository, with "Contents: Read and write" permission — nothing else.
            If you check "Remember these," they're saved in this browser's local storage on this device only —
            not sent anywhere else, but visible to anyone who uses this browser on this device. Leave it
            unchecked on a shared or public computer.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="masthead">
        <h1>Birthday Manager</h1>
        <span className="sub">{owner}/{repo}</span>
      </div>

      {status && <div className={`status ${status.type}`}>{status.text}</div>}

      <div className="panel">
        <h2>Add a friend</h2>
        <div className="row3">
          <div>
            <label>Name</label>
            <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Jordan" />
          </div>
          <div>
            <label>Birthday</label>
            <input type="date" value={newDate} onChange={e => setNewDate(e.target.value)} />
          </div>
          <div>
            <label>Group</label>
            <select value={newCategory} onChange={e => setNewCategory(e.target.value)}>
              {CATEGORIES.map(c => <option key={c.key} value={c.key}>{c.label}</option>)}
            </select>
          </div>
        </div>
        <button className="btn btn-candle" disabled={!newName.trim() || !newDate || loading} onClick={handleAdd}>
          Add birthday
        </button>
      </div>

      <div className="panel">
        <h2>Everyone ({friends.length})</h2>
        {friends.length === 0 ? (
          <div className="empty">No birthdays yet — add your first friend above.</div>
        ) : (
          <div className="columns">
            {CATEGORIES.map(cat => {
              const inCategory = friends
                .filter(f => (f.category || 'friends') === cat.key)
                .sort((a, b) => daysUntil(a.date) - daysUntil(b.date));
              return (
                <div
                  key={cat.key}
                  onDragOver={e => { e.preventDefault(); setDragOverCat(cat.key); }}
                  onDragLeave={() => setDragOverCat(prev => prev === cat.key ? null : prev)}
                  onDrop={e => {
                    e.preventDefault();
                    const name = e.dataTransfer.getData('text/plain');
                    setDragOverCat(null);
                    setDraggingName(null);
                    if (name) moveToCategory(name, cat.key);
                  }}
                  style={{
                    borderRadius: 8,
                    outline: dragOverCat === cat.key ? `2px dashed var(--black)` : 'none',
                    outlineOffset: 4,
                    transition: 'outline 0.1s',
                  }}
                >
                  <div className="column-header">{cat.label} ({inCategory.length})</div>
                  {inCategory.length === 0 ? (
                    <div className="empty" style={{padding: '10px 0'}}>{dragOverCat === cat.key ? 'Drop here' : 'Nobody here yet.'}</div>
                  ) : (
                    <ul className="friend-list">
                      {inCategory.map(f => {
                        if (editingName === f.name) {
                          return (
                            <li className="friend friend-editing" key={f.name} style={{flexDirection: 'column', alignItems: 'stretch'}}>
                              <input
                                type="text"
                                value={editName}
                                onChange={e => setEditName(e.target.value)}
                                style={{marginBottom: 6}}
                              />
                              <input
                                type="date"
                                value={editDate}
                                onChange={e => setEditDate(e.target.value)}
                                style={{marginBottom: 6}}
                              />
                              <div>
                                <button className="btn btn-candle" style={{padding: '6px 12px', fontSize: 12.5}} disabled={loading} onClick={() => saveEdit(f.name)}>Save</button>
                                <button className="del" style={{marginLeft: 10}} onClick={cancelEdit}>cancel</button>
                              </div>
                            </li>
                          );
                        }
                        const d = daysUntil(f.date);
                        const age = turningAge(f.date);
                        return (
                          <li
                            className="friend"
                            key={f.name}
                            draggable
                            onDragStart={e => { e.dataTransfer.setData('text/plain', f.name); setDraggingName(f.name); }}
                            onDragEnd={() => { setDraggingName(null); setDragOverCat(null); }}
                            style={{
                              cursor: 'grab',
                              opacity: draggingName === f.name ? 0.4 : 1,
                            }}
                          >
                            <span className={`days ${d === 0 ? 'today' : ''}`}>{d === 0 ? 'today' : `${d}d`}</span>
                            <span className="name">{f.name}{age !== null ? <span style={{color: 'var(--muted)', fontWeight: 400, fontSize: '0.87em'}}> — {age}</span> : null}</span>
                            <button className="del" onClick={() => startEdit(f)}>edit</button>
                            <button className="del" onClick={() => handleDelete(f.name)}>remove</button>
                            <span className="date">{formatDate(f.date)}</span>
                          </li>
                        );
                      })}
                    </ul>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="footer-actions">
        <button className="btn btn-ghost" onClick={loadFromGitHub} disabled={loading}>Refresh from GitHub</button>
        <button className="btn btn-ghost" onClick={() => {
          localStorage.removeItem('bday_owner');
          localStorage.removeItem('bday_repo');
          localStorage.removeItem('bday_token');
          setConnected(false);
          setToken('');
          setRememberMe(false);
        }}>Forget saved login</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
